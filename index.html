<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Retentide</title>
<meta name="description" content="AI-powered vocabulary learning with contextual practice and FSRS-powered review. Open source, built for everyday learning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,650;1,7..72,400&display=swap">
<style>
/* Layout: one index card on a cool slate desk. A single 600px column; only the active
   question card is a bordered object (with the red top rule of a ruled index card). */
:root {
  --desk: #eceff3;
  --card: #ffffff;
  --ink: #18212c;
  --muted: #5b6878;
  --line: #d6dce3;
  --soft: #e3e8ee;
  --accent: #2c46c8;
  --accent-ink: #ffffff;
  --rule: #d2493f;
  --ok: #1d8656;
  --ok-soft: #dcf1e6;
  --bad: #c43d33;
  --bad-soft: #fbe3e0;
  --warn: #a8660c;
  --l1: #c9d1db; --l2: #9db0d9; --l3: #6684d6; --l4: #3550c4; --l5: #1d2f86;
  --f-head: "Literata", "Songti SC", Georgia, serif;
  --f-body: "IBM Plex Sans", -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #11151b; --card: #1a2029; --ink: #e5eaf0; --muted: #94a2b2; --line: #2c3541; --soft: #232b36;
    --accent: #8fa3ff; --accent-ink: #0f1530; --rule: #f0776c; --ok: #4fc58d; --ok-soft: #173426;
    --bad: #ff8277; --bad-soft: #3b1c1a; --warn: #e7a74b;
    --l1: #39434f; --l2: #3f5486; --l3: #5672c9; --l4: #7f96f0; --l5: #b9c6ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #11151b; --card: #1a2029; --ink: #e5eaf0; --muted: #94a2b2; --line: #2c3541; --soft: #232b36;
  --accent: #8fa3ff; --accent-ink: #0f1530; --rule: #f0776c; --ok: #4fc58d; --ok-soft: #173426;
  --bad: #ff8277; --bad-soft: #3b1c1a; --warn: #e7a74b;
  --l1: #39434f; --l2: #3f5486; --l3: #5672c9; --l4: #7f96f0; --l5: #b9c6ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--desk); color: var(--ink);
  font: 15px/1.55 var(--f-body);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.wrap {
  max-width: 600px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 96px;
  display: flex; flex-direction: column; gap: 22px;
}
/* the word bank uses wide screens: the overview spreads into columns */
.wrap:has(.bank-wide) { max-width: 1040px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 4px; }
.brand { font-family: var(--f-head); font-weight: 650; font-size: 19px; letter-spacing: .01em; }
.brand small { font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; letter-spacing: .04em; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px;
  font-size: 12px; color: var(--muted); background: var(--soft); white-space: nowrap; border: 0;
}
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.chip.ok i { background: var(--ok); } .chip.warn i { background: var(--warn); } .chip.bad i { background: var(--bad); }

.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
h2 { font-family: var(--f-head); font-weight: 650; font-size: 17px; margin: 0; text-wrap: balance; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* the index card */
.card {
  background: var(--card); border-radius: var(--r);
  border: 1px solid var(--line);
  box-shadow: 0 1px 0 rgba(20, 30, 50, .04), 0 8px 24px -16px rgba(20, 30, 60, .25);
  position: relative; overflow: hidden;
}
.card.ruled::before { content: ""; position: absolute; left: 0; right: 0; top: 46px; height: 1px; background: var(--rule); opacity: .55; }
.today { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 16px; }
.today-head { display: flex; justify-content: space-between; align-items: baseline; min-height: 24px; gap: 8px; }
.today-head b { font-family: var(--f-head); font-weight: 650; font-size: 16px; }
.counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding-top: 6px; }
.count .n { font-family: var(--f-head); font-weight: 650; font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.count .l { font-size: 12.5px; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--card); border-radius: 8px;
  padding: 11px 16px; font-weight: 500; min-height: 46px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); flex: 1 1 180px; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.grow { flex: 1 1 140px; }
.sec > .btn, .sheet > .btn, .today > .btn { flex: none; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.sm { min-height: 34px; padding: 6px 12px; font-size: 13.5px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

/* mastery bar */
.bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--l1); }
.bar span { display: block; height: 100%; }
.legend { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; font-size: 12px; color: var(--muted); }
.legend div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.legend b { font-family: var(--f-mono); font-weight: 500; color: var(--ink); font-size: 13px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }

/* activity */
.acts { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; align-items: end; height: 86px; }
.act { display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; height: 100%; gap: 3px; }
.act .b { background: var(--l3); border-radius: 3px 3px 1px 1px; min-height: 2px; }
.act .b.zero { background: var(--soft); }
.act.now .b { background: var(--accent); }
.act .d { font-size: 10px; color: var(--muted); text-align: center; font-family: var(--f-mono); }

/* list rows */
.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.item {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 2px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%;
}
.item:hover { background: color-mix(in srgb, var(--soft) 60%, transparent); }
.item .t { font-weight: 500; }
.item .s { font-size: 13px; color: var(--muted); }
.item > div { min-width: 0; }
.item .go { color: var(--muted); font-size: 18px; }

/* tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: color-mix(in srgb, var(--desk) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabs nav { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { background: none; border: 0; padding: 12px 0 10px; color: var(--muted); font-size: 13.5px; font-weight: 500; }
.tabs button[aria-current="page"] { color: var(--ink); box-shadow: inset 0 2px 0 var(--accent); }

/* session */
.sess-top { display: flex; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--desk); padding-block: 8px; z-index: 3; }
.prog { flex: 1; height: 4px; background: var(--soft); border-radius: 2px; overflow: hidden; }
.prog span { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.x { border: 0; background: var(--soft); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; line-height: 1; color: var(--muted); }
.q { padding: 14px 20px 22px; display: flex; flex-direction: column; gap: 14px; min-height: 220px; }
.q-meta { display: flex; justify-content: space-between; align-items: center; min-height: 24px; gap: 8px; font-size: 12.5px; color: var(--muted); }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 4px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.tag.trap { background: color-mix(in srgb, var(--rule) 16%, transparent); color: var(--rule); }
.tag.conf { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.tag.ai { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.hw { font-family: var(--f-head); font-weight: 650; font-size: clamp(32px, 9vw, 44px); line-height: 1.12; letter-spacing: -.005em; overflow-wrap: anywhere; padding-top: 18px; }
.pos { font-family: var(--f-head); font-style: italic; color: var(--muted); font-size: 15px; }
.prompt-zh { font-size: 21px; line-height: 1.5; padding-top: 18px; font-weight: 500; }
.prompt-en { font-size: 14px; color: var(--muted); }
.sent { font-family: var(--f-head); font-size: 19px; line-height: 1.6; padding-top: 18px; }
.sent .blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--ink); }
.sent .fill { color: var(--ok); border-bottom: 2px solid var(--ok); font-weight: 650; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start; text-align: left;
  border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 12px 14px; min-height: 50px; width: 100%;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 2px; min-width: 1ch; }
.opt .v { min-width: 0; overflow-wrap: anywhere; }
.opt.en .v { font-family: var(--f-head); font-size: 17px; font-weight: 500; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.opt:disabled:not(.right):not(.wrong) { opacity: .6; }
.opt.done:not(.right):not(.wrong) { color: var(--muted); }
.opt.done:hover { border-color: var(--line); }
.opt .gloss { display: block; margin-top: 2px; font-family: var(--f-body); font-size: 13px; font-weight: 400; color: var(--muted); }
.unk { align-self: center; }
.typebox { display: flex; flex-direction: column; gap: 10px; }
.typebox input, .field input, .field select, .search input, .modal textarea, .modal input {
  width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 11px 12px; min-height: 46px;
}
.verdict { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); } .verdict.mid { color: var(--warn); }
.verdict small { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.feedback { font-size: 14px; background: var(--soft); border-radius: 8px; padding: 10px 12px; }

/* entry (dictionary card) */
.entry { display: flex; flex-direction: column; gap: 12px; }
.entry-hw { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.entry-hw .w { font-family: var(--f-head); font-weight: 650; font-size: 26px; }
.sense { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; }
.sense .p { font-family: var(--f-head); font-style: italic; color: var(--muted); font-size: 14px; padding-top: 1px; }
.sense .zh { font-weight: 500; }
.sense .en { color: var(--muted); font-size: 13.5px; grid-column: 2; }
.sense .ex { grid-column: 2; font-size: 13.5px; border-left: 2px solid var(--line); padding-left: 10px; margin-top: 4px; }
.sense .ex .e { font-family: var(--f-head); }
.sense .ex .z { color: var(--muted); }
.sense.trap .zh::after { content: "冷门义"; font-size: 11px; color: var(--rule); margin-left: 6px; font-weight: 400; }
html[lang="en"] .sense.trap .zh::after { content: "less common sense"; }
.rels { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.rels .lab { color: var(--muted); margin-right: 6px; }
.rels button.wl { border: 0; background: none; padding: 0; color: var(--accent); font-family: var(--f-head); font-size: 14.5px; }
.ai-box { border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.ai-box h4 { margin: 0; font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
.ai-box p { margin: 0; }
.reveal { padding: 16px 20px; }
.next-row { display: flex; gap: 10px; align-items: center; }
.next-row .btn.primary { flex: 1; }
.autonote { font-size: 12px; color: var(--muted); }

/* Merriam-Webster */
.mw-line { grid-column: 2; font-size: 13px; margin-top: 3px; padding: 4px 8px; border-radius: 6px; background: color-mix(in srgb, var(--accent) 7%, transparent); }
.mw-id { font-family: var(--f-mono); font-size: 11px; color: var(--accent); margin-right: 6px; white-space: nowrap; }
.mw-fix { grid-column: 2; font-size: 13px; margin-top: 3px; padding: 4px 8px; border-radius: 6px; background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--ink); }
.mw-full { border-top: 1px dashed var(--line); padding-top: 10px; font-size: 13.5px; display: flex; flex-direction: column; gap: 10px; }
.mw-full > summary, .mw-old > summary { cursor: pointer; color: var(--accent); font-size: 13.5px; }
.mw-full[open] > summary { margin-bottom: 6px; }
.mw-entry { display: flex; flex-direction: column; gap: 4px; padding-top: 6px; }
.mw-hw b { font-family: var(--f-head); font-size: 15px; }
.mw-sense { display: grid; grid-template-columns: 2.6em minmax(0, 1fr); gap: 6px; }
.mw-sn { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); padding-top: 2px; }
.mw-dro { padding-left: calc(2.6em + 6px); }
.prompt-def { font-family: var(--f-head); font-size: 19px; line-height: 1.55; padding-top: 18px; }

/* notes and chat */
.notes { display: flex; flex-direction: column; gap: 6px; }
.note { font-size: 13.5px; padding: 6px 10px; border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); border-radius: 0 6px 6px 0; }
.note-row { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.note-row > span { min-width: 0; overflow-wrap: anywhere; }
.note-row > button { flex: 0 0 auto; white-space: nowrap; }
.noteinput, .addlink input, .chatf textarea, .pinform textarea, .pinform select, .pinform input, #tier {
  border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 9px 11px; min-height: 40px; width: 100%;
}
#tier { width: auto; min-height: 34px; padding: 4px 8px; font-size: 13px; }
.chat-head h2 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.links { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lchip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 99px; background: var(--card); overflow: hidden; }
.lchip button { border: 0; background: none; padding: 4px 4px 4px 10px; font-size: 13px; }
.lchip-w { font-family: var(--f-head); }
.lchip .lchip-x { padding: 4px 10px 4px 4px; color: var(--muted); }
.addlink { display: inline-flex; }
.lchip.ext { border-style: dashed; }
.btn.dashed { border-style: dashed; }
.linkask:empty { display: none; }
.addlink input { min-height: 30px; padding: 3px 10px; border-radius: 99px; width: 8.5em; font-size: 13px; }
.msgs { display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; }
.msg.u { justify-content: flex-end; }
.msg .bubble { max-width: 92%; min-width: 0; overflow-wrap: anywhere; padding: 10px 12px; border-radius: 12px; font-size: 14.5px; line-height: 1.6; }
.msg.u .bubble { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.u .bubble .muted { color: inherit; opacity: .72; }
.msg.a .bubble { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.a .bubble p { margin: 0 0 6px; }
.msg.a .bubble ul { margin: 0 0 6px; padding-left: 1.2em; }
.msg.a .bubble code { font-family: var(--f-mono); font-size: 12.5px; }
.msg-actions { display: flex; justify-content: flex-end; }
.sugnote .btn { white-space: nowrap; flex: 0 0 auto; }
.sugnote { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin: 6px 0; padding: 6px 8px; border-radius: 8px; background: color-mix(in srgb, var(--ok) 12%, transparent); font-size: 13.5px; }
.pinform { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sugg:empty { display: none; }
.composer { position: sticky; bottom: calc(-24px - env(safe-area-inset-bottom, 0px)); background: var(--desk); padding-block: 8px; display: flex; flex-direction: column; gap: 6px; }
.composer.dropping { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 8px; }
.chatf { display: flex; flex-direction: column; gap: 6px; }
.chatf textarea { resize: vertical; min-height: 56px; font-size: 15px; }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
.thumb { position: relative; }
.thumb img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; }
.thumb button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--ink); color: var(--desk); font-size: 13px; line-height: 1; }
.chat-foot { justify-content: flex-end; }
.chat-sum { border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px; }
.chat-sum > summary { cursor: pointer; }

/* pronunciation */
.say { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--accent); vertical-align: middle; margin-left: 4px; padding: 0; flex: 0 0 auto; }
.say:hover { border-color: var(--accent); }
.say.busy { opacity: .5; }
.pron { display: inline-flex; align-items: center; gap: 2px; margin-right: 8px; white-space: nowrap; }
.prs { font-family: var(--f-body); color: var(--muted); font-size: 14px; }
.pron-alt { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; }
.hw-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; padding-top: 18px; }
.hw-row .hw { padding-top: 0; }
.hw-pron { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.entry-hw { align-items: center; }

/* fill-in practice */
.opt.picked { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
.pr-group { display: flex; flex-direction: column; gap: 6px; }
.pr-text { line-height: 1.75; }
.pr-slot { display: inline-block; min-width: 5.5em; padding: 0 4px; }
.fill.bad { color: var(--bad); border-bottom-color: var(--bad); }
.pr-chip { display: inline-flex; align-items: center; gap: 4px; }

/* word bank */
.search { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--desk); padding-block: 6px; z-index: 2; display: flex; flex-direction: column; gap: 8px; }
.search.stuck::before, .sess-top.stuck::before { content: ''; position: absolute; bottom: 100%; height: env(safe-area-inset-top, 0px); left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); background: var(--desk); }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
